// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://maven.google.com' }
        
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        // the Kotlin plugin AGP's built-in Kotlin support applies: a release that no longer calls
        // Configuration.setVisible (deprecated in Gradle 9; turning built-in Kotlin off is itself deprecated)
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://maven.google.com' }
        
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
