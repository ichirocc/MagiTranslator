## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Wed Jun 05 15:24:01 CEST 2024
android.debug.obsoleteApi=true
# Jetifier off: RadioGroupPlus (legacy support library, the last dependency that needed it) was replaced by
# widgets/NestedRadioGroup; checkJetifier found no other library
android.enableJetifier=false
android.nonTransitiveRClass=false
android.useAndroidX=true
keyAlias=androiddebugkey
keyPassword=android
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
storeFile=../../../../../.android/debug.keystore
storePassword=android

# Avoid xerces SAXNotRecognizedException when parsing maven-metadata on CI
systemProp.javax.xml.parsers.SAXParserFactory=com.sun.org.apache.xerces.internal.jaxp.SAXParserFactoryImpl
systemProp.javax.xml.parsers.DocumentBuilderFactory=com.sun.org.apache.xerces.internal.jaxp.DocumentBuilderFactoryImpl
# no Kotlin sources: AGP 9's built-in Kotlin support is off (it applies the Kotlin base plugin, which calls the
# Configuration.setVisible API deprecated in Gradle 9)
android.builtInKotlin=false
