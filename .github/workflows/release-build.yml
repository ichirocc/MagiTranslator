name: Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.12674087" "cmake;3.22.1"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          grep -n -E "(error:|FAILURE:|What went wrong|Execution failed)" build.log | head -120 || true
          tail -120 build.log || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magitranslator-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
