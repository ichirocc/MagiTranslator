name: Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.12674087" "cmake;3.22.1"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: |
          grep -n -E "(error:|FAILURE:|What went wrong|Execution failed)" build.log | head -120 || true
          tail -120 build.log || true

      - name: Verify 16KB page alignment (Android 16 devices)
        shell: bash
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$apk" | tail -5

      - name: Rename APK
        shell: bash
        run: |
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/MagiTranslator-${ver}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MagiTranslator-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            MagiTranslator (日本語⇄ネパール語 / 日本語⇄ベトナム語)
            1. 「提供元不明のアプリ」を許可して APK をインストール
            2. 初回起動でモデルをダウンロード（Wi-Fi 推奨）
            3. 設定 → Models Manager で Madlad（ネパール語）と HY-MT（ベトナム語）をダウンロード
