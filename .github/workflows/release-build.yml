name: Release Build

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # native libraries are vendored in the repository (docs/VENDORED.md): no submodule download

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;4.1.2"

      - name: Pure-Java tests (jane library, zip safety)
        shell: bash
        run: |
          mkdir -p /tmp/jt
          javac -encoding UTF-8 -d /tmp/jt app/src/main/java/nie/translator/rtranslator/jane/*.java app/src/main/java/nie/translator/rtranslator/jane/ir/*.java app/src/main/java/nie/translator/rtranslator/jane/text/*.java \
            app/src/main/java/nie/translator/rtranslator/downloader/ZipSafety.java \
            app/src/test/java/nie/translator/rtranslator/jane/JaNeLibraryTest.java \
            app/src/test/java/nie/translator/rtranslator/jane/ValidatorParityDump.java \
            app/src/test/java/nie/translator/rtranslator/downloader/ZipSafetyTest.java \
            app/src/main/java/nie/translator/rtranslator/downloader/ModelSources.java \
            app/src/test/java/nie/translator/rtranslator/downloader/ModelSourcesTest.java \
            app/src/main/java/nie/translator/rtranslator/downloader/ModelStore.java \
            app/src/main/java/nie/translator/rtranslator/downloader/ManifestSignature.java \
            app/src/test/java/nie/translator/rtranslator/downloader/ModelStoreTest.java \
            app/src/main/java/nie/translator/rtranslator/plamo/*.java \
            app/src/test/java/nie/translator/rtranslator/plamo/PlamoTest.java \
            app/src/main/java/nie/translator/rtranslator/tools/nn/Utils.java \
            app/src/test/java/nie/translator/rtranslator/tools/nn/UtilsTest.java
          java -Dstdout.encoding=UTF-8 -cp /tmp/jt nie.translator.rtranslator.jane.JaNeLibraryTest
          java -cp /tmp/jt nie.translator.rtranslator.tools.nn.UtilsTest   # beam search top-k == the old repeated scans
          java -Dstdout.encoding=UTF-8 -cp /tmp/jt nie.translator.rtranslator.plamo.PlamoTest   # PLaMo prompts, glossary, history, license gate
          java -cp /tmp/jt nie.translator.rtranslator.downloader.ZipSafetyTest
          java -cp /tmp/jt nie.translator.rtranslator.downloader.ModelSourcesTest   # pinned model hashes, no upstream URL
          java -cp /tmp/jt nie.translator.rtranslator.downloader.ModelStoreTest     # atomic install, rollback, manifest signature
          python3 -I tools/eval/test_metrics.py   # eval metrics must stay in sync with the Java validator
          python3 -I tools/eval/test_eval_dataset.py   # eval dataset tools (build_candidates, review_sheet, run_eval extensions)
          # Java validator vs its Python port (identical verdict text): seed + test_v1 sources x every stored
          # candidate (seed references and all docs/eval/outputs/*.tsv, i.e. raw, v1-v5, with/without dictionaries)
          java -cp /tmp/jt nie.translator.rtranslator.jane.ValidatorParityDump tools/eval/testset_seed.tsv \
            --testset tools/eval/testsets/test_v1_candidates.tsv docs/eval/outputs/*.tsv > /tmp/validator_dump.tsv
          python3 -I tools/eval/check_validator_parity.py /tmp/validator_dump.tsv
          python3 -I tools/dict/test_textbook_terms.py   # textbook vocabulary tool

      - name: Restore release keystore from secrets (optional)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MAGI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MAGI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "using keystore from secrets"
          else
            echo "::warning::MAGI_KEYSTORE_BASE64 not set - using the temporary public sideload key"
          fi

      - name: Build release APK
        shell: bash
        env:
          MAGI_KEYSTORE_PASSWORD: ${{ secrets.MAGI_KEYSTORE_PASSWORD }}
          MAGI_KEY_ALIAS: ${{ secrets.MAGI_KEY_ALIAS }}
          MAGI_KEY_PASSWORD: ${{ secrets.MAGI_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --stacktrace --warning-mode all 2>&1 | tee build.log   # list each deprecated Gradle feature, not just a count

      - name: Error summary
        if: failure()
        run: |
          grep -n -E "(error:|FAILURE:|What went wrong|Execution failed)" build.log | head -120 || true
          tail -120 build.log || true

      - name: Check 16KB ELF alignment of native libs (Android 16 devices)
        shell: bash
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          rm -rf /tmp/apk && mkdir -p /tmp/apk && unzip -q -o "$apk" 'lib/*' -d /tmp/apk || true
          readelf=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf | head -1)
          bad=0
          for so in $(find /tmp/apk/lib -name '*.so'); do
            align=$("$readelf" -lW "$so" | awk '/LOAD/{print $NF}' | sort -u | head -1)
            if [ $(( align )) -lt $(( 0x4000 )) ]; then echo "::warning::$(basename $so) LOAD align $align (<16KB)"; bad=1; else echo "ok $(basename $so) $align"; fi
          done
          echo "16KB check done (bad=$bad)"

      - name: Rename APK
        id: ver
        shell: bash
        run: |
          ver=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/MagiTranslator-${ver}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MagiTranslator-apk
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (main / tags)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          target_commitish: ${{ github.sha }}
          name: MagiTranslator ${{ steps.ver.outputs.ver }}
          make_latest: true
          files: dist/*.apk
          body: |
            MagiTranslator (日本語⇄ネパール語 / 日本語⇄ベトナム語)
            1. 「提供元不明のアプリ」を許可して APK をインストール
            2. 初回起動でモデルをダウンロード（Wi-Fi 推奨）
            3. 設定 → Models Manager で Madlad（ネパール語）と HY-MT（ベトナム語）をダウンロード
